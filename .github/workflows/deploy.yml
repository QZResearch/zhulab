name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Blowfish needs Hugo extended >= 0.162.0
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls in themes/blowfish
          fetch-depth: 0          # so .GitInfo / .Lastmod work

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # base_url comes from the Pages config, so the /<repo>/ subpath is
        # handled automatically — no need to hard-code baseURL for the project site
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
